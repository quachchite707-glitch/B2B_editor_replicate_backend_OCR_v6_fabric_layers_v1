<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>JSON → Fabric 可视化</title>
  <style>
    :root { --border:#e5e7eb; --bg:#f9fafb; --text:#111827; --muted:#6b7280; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial; color:var(--text); background:#fff; }
    .wrap { display:grid; grid-template-columns: 460px 1fr; height:100vh; }
    .left { border-right:1px solid var(--border); padding:16px; overflow:auto; background:var(--bg); }
    .right { padding:16px; overflow:hidden; background:#fff; }
    h1 { font-size:18px; margin:0 0 8px 0; }
    .hint { font-size:12px; color:var(--muted); line-height:1.55; margin-bottom:12px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
    input[type="text"] { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; outline:none; }
    textarea { width:100%; height:330px; padding:10px; border:1px solid var(--border); border-radius:8px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; font-size:12px; line-height:1.4; }
    button { padding:9px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; }
    button.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
    button.danger { background:#ef4444; color:#fff; border-color:#ef4444; }
    label { font-size:12px; color:var(--text); display:flex; align-items:center; gap:6px; }
    select { padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:#fff; }
    .status { margin-top:10px; font-size:12px; color:var(--muted); padding:10px; border:1px dashed var(--border); border-radius:10px; background:#fff; white-space:pre-wrap;}
    .stageWrap { height: calc(100vh - 32px); border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; }
    .stageHead { padding:10px 12px; border-bottom:1px solid var(--border); background:#fff; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
    #stage { width:100%; height: calc(100% - 41px); background:#fff; }
    canvas { display:block; }
    .mini { font-size:12px; color:var(--muted); }
    .badge { font-size:11px; padding:2px 8px; border:1px solid var(--border); border-radius:999px; background:var(--bg); color:var(--muted); }
    .err { color:#b91c1c; }
    .group { padding:10px; border:1px solid var(--border); border-radius:12px; background:#fff; }
    .groupTitle { font-size:12px; color:var(--muted); margin-bottom:8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <h1>JSON → Fabric 可视化</h1>
    <div class="hint">
      ✅ 原则：<b>JSON.width/height 是“设计坐标系”</b>；右侧预览容器是“显示坐标系”；通过 viewportTransform 做缩放/居中。<br/>
      ⚠️ 背景要“坐标严格对齐”，请用 <b>stretch</b>（cover/contain 会裁切或留白导致坐标漂移）。<br/>
      ⚠️ Canvas 的 textBaseline 合法值是 <code>alphabetic</code>（不是 alphabetical）。
    </div>

    <div class="row">
      <div style="flex:1">
        <div class="mini">后端地址</div>
        <input id="backendUrl" type="text" value="http://127.0.0.1:8001" />
      </div>
    </div>

    <div class="group" style="margin:10px 0;">
      <div class="groupTitle">A) 图片 → 后端解析 → 自动渲染（推荐）</div>
      <div class="row">
        <input id="imgFile" type="file" accept="image/*" />
        <button class="primary" id="btnAnalyze">后端解析并渲染</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="useImgSizeAsDesign" checked /> 以背景像素为设计尺寸（自动修正坐标）</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="autoRecolor" checked /> 自动估计文字颜色（实验，需背景图）</label>
        <button id="btnRecolor">重算文字颜色</button>
      </div>
    </div>

    <div class="group" style="margin:10px 0;">
      <div class="groupTitle">B) 仅加载背景（本地文件）</div>
      <div class="row">
        <input id="bgFile" type="file" accept="image/*" />
      </div>
      <div class="row">
        <label>背景 fit：</label>
        <select id="bgFit">
          <option value="stretch">stretch（对齐坐标）</option>
          <option value="contain">contain（完整显示）</option>
          <option value="cover">cover（铺满裁切）</option>
        </select>

        <label style="margin-left:auto">
          <input type="checkbox" id="autoFit" checked />
          自适应缩放
        </label>
      </div>
    </div>

    <div class="row">
      <label><input type="checkbox" id="showTextBox" checked/> 显示 text bbox</label>
      <label><input type="checkbox" id="showShapeBox" checked/> 显示 shape bbox</label>
    </div>

    <div class="row">
      <button id="btnRender" class="primary">渲染 JSON</button>
      <button id="btnClear" class="danger">清空</button>
      <button id="btnExample">加载示例</button>
    </div>

    <textarea id="jsonInput" spellcheck="false" placeholder="粘贴 /parse_fabric 返回的 JSON（layers），或旧的 {width,height,texts,bars} JSON"></textarea>

    <div id="status" class="status">状态：等待操作…</div>
  </div>

  <div class="right">
    <div class="stageWrap">
      <div class="stageHead">
        <div>Fabric 画布预览 <span id="badge" class="badge">-</span></div>
        <div class="mini" id="sizeInfo">-</div>
      </div>
      <div id="stage"><canvas id="c"></canvas></div>
    </div>
  </div>
</div>

<!-- Fabric.js（如果你离线用不了 CDN，就把 fabric.min.js 下载到同目录改成本地引用） -->
<script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const statusEl = $("status");
  const badgeEl = $("badge");
  const sizeInfoEl = $("sizeInfo");

  // ====== State ======
  let canvas;
  let designW = 896;
  let designH = 1200;

  let bgImageObj = null;     // fabric.Image used as backgroundImage
  let bgHtmlImage = null;    // HTMLImageElement for pixel sampling
  let bgDataUrl = null;      // dataURL of bg
  let bgTransform = { left:0, top:0, scaleX:1, scaleY:1, iw:1, ih:1 };

  let lastJSON = null;

  // bbox overlay objs
  let overlayObjs = [];

  function setStatus(msg, isErr=false){
    statusEl.innerHTML = (isErr ? '<span class="err">' : '') + msg + (isErr ? '</span>' : '');
  }

  function initCanvasOnce(){
    if (canvas) return;
    canvas = new fabric.Canvas("c", {
      preserveObjectStacking: true,
      selection: false,
      backgroundColor: "#ffffff"
    });
    fabric.Object.prototype.transparentCorners = false;

    window.addEventListener("resize", () => {
      resizeToContainer();
      applyViewport();
      canvas.requestRenderAll();
    });

    resizeToContainer();
    applyViewport();
  }

  function resizeToContainer(){
    const stage = $("stage");
    const rect = stage.getBoundingClientRect();
    const w = Math.max(100, Math.floor(rect.width));
    const h = Math.max(100, Math.floor(rect.height));
    canvas.setWidth(w);
    canvas.setHeight(h);
  }

  function applyViewport(){
    if (!canvas) return;
    const autoFit = $("autoFit").checked;
    const cw = canvas.getWidth();
    const ch = canvas.getHeight();

    let zoom = 1;
    if (autoFit) zoom = Math.min(cw / designW, ch / designH);

    const offsetX = (cw - designW * zoom) / 2;
    const offsetY = (ch - designH * zoom) / 2;
    canvas.setViewportTransform([zoom, 0, 0, zoom, offsetX, offsetY]);

    badgeEl.textContent = `zoom=${zoom.toFixed(3)}`;
    sizeInfoEl.textContent = `design=${designW}×${designH} | view=${cw}×${ch}`;
  }

  // ====== Utils: color parsing ======
  // Support: #RGB/#RRGGBB/#RRGGBBAA/rgb()/rgba() (Fabric can accept these)
  function normalizeColor(c){
    if (!c || typeof c !== "string") return null;
    const s = c.trim();
    if (!s) return null;

    // #RGB, #RRGGBB, #RRGGBBAA
    if (/^#([0-9a-fA-F]{3})$/.test(s)) return s;
    if (/^#([0-9a-fA-F]{6})$/.test(s)) return s;
    if (/^#([0-9a-fA-F]{8})$/.test(s)) {
      // convert #RRGGBBAA -> rgba()
      const r = parseInt(s.slice(1,3), 16);
      const g = parseInt(s.slice(3,5), 16);
      const b = parseInt(s.slice(5,7), 16);
      const a = parseInt(s.slice(7,9), 16) / 255;
      return `rgba(${r},${g},${b},${Number(a.toFixed(4))})`;
    }

    // rgb()/rgba()
    if (/^rgba?\(\s*\d+(\s*,\s*\d+){2}(\s*,\s*(0|1|0?\.\d+))?\s*\)$/.test(s)) return s;

    // allow named colors too
    return s;
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

  function scaleLayers(layers, sx, sy){
    const s = Math.min(sx, sy);
    const out = deepClone(layers);
    for (const l of out) {
      if (typeof l.x === "number") l.x *= sx;
      if (typeof l.y === "number") l.y *= sy;
      if (typeof l.width === "number") l.width *= sx;
      if (typeof l.height === "number") l.height *= sy;

      if (l.type === "TEXT" && l.style) {
        if (typeof l.style.fontSize === "number") l.style.fontSize *= s;
        if (typeof l.style.strokeWidth === "number") l.style.strokeWidth *= s;
      }
      if (l.type === "SHAPE" && l.style) {
        if (typeof l.style.radius === "number") l.style.radius *= s;
        if (typeof l.style.strokeWidth === "number") l.style.strokeWidth *= s;
      }
    }
    return out;
  }

  // ====== JSON Normalization ======
  function normalizeToLayers(input){
    // Accept:
    // 1) {width,height,layers:[...]}  (parse_fabric)
    // 2) {width,height,texts:[{text,bbox,score}], bars:[{bbox,...}]} (older)
    const w = input.width || input.canvas?.width;
    const h = input.height || input.canvas?.height;
    if (!w || !h) throw new Error("JSON 缺少 width/height");

    let layers = input.layers;
    if (!Array.isArray(layers)) {
      layers = [];
      layers.push({
        id: "bg-1",
        type: "BG_IMAGE",
        name: "背景",
        x: 0, y: 0, width: w, height: h,
        opacity: 1, rotation: 0, locked: true, hidden: false, zIndex: 0,
        data: { assetUrl: "string", fit: "cover" },
        style: null
      });

      const texts = input.texts || [];
      texts.forEach((t, idx) => {
        const [x1,y1,x2,y2] = t.bbox;
        layers.push({
          id: `text-${idx+1}`,
          type: "TEXT",
          name: "文字",
          x: x1,
          y: y1,
          width: Math.max(1, x2-x1),
          height: Math.max(1, y2-y1),
          opacity: 1,
          rotation: 0,
          locked: false,
          hidden: false,
          zIndex: 100 + idx,
          data: { text: t.text, textAutoSize: "fixed", score: t.score ?? null },
          style: {
            fontFamily: "SourceHanSansSC",
            fontSize: Math.max(12, Math.round((y2-y1) * 0.85)),
            fontWeight: 700,
            fontStyle: "normal",
            underline: false,
            fill: "#111111",
            align: "left",
            stroke: "#000000",
            strokeWidth: 0,
            shadow: null,
            lineHeight: 1.1,
            letterSpacing: 0
          }
        });
      });

      const bars = input.bars || [];
      bars.forEach((b, idx) => {
        const [x1,y1,x2,y2] = b.bbox;
        layers.push({
          id: `shape-${idx+1}`,
          type: "SHAPE",
          name: "叠加层",
          x: x1, y: y1,
          width: Math.max(1, x2-x1),
          height: Math.max(1, y2-y1),
          opacity: b.opacity ?? 1,
          rotation: 0,
          locked: false,
          hidden: false,
          zIndex: 10 + idx,
          data: { shapeType: "rect" },
          style: { fill: b.fill || "#dddddd", strokeWidth: 0, stroke: "#000000", radius: b.radius || 0 }
        });
      });
    }

    return { width: w, height: h, layers };
  }

  // ====== Fabric Builders ======
  function clearOverlay(){
    overlayObjs.forEach(o => canvas.remove(o));
    overlayObjs = [];
  }

  function addBBoxRect(bbox, color){
    const [x1,y1,x2,y2] = bbox;
    const rect = new fabric.Rect({
      left: x1,
      top: y1,
      width: Math.max(1, x2-x1),
      height: Math.max(1, y2-y1),
      fill: "rgba(0,0,0,0)",
      stroke: color,
      strokeWidth: 2,
      selectable: false,
      evented: false
    });
    overlayObjs.push(rect);
    canvas.add(rect);
    rect.moveTo(999999);
  }

  function makeShape(layer){
    const st = layer.style || {};
    const fill = normalizeColor(st.fill) || "#dddddd";
    const stroke = normalizeColor(st.stroke) || "rgba(0,0,0,0)";
    const strokeWidth = Number(st.strokeWidth || 0);
    const radius = Number(st.radius || 0);

    return new fabric.Rect({
      left: layer.x || 0,
      top: layer.y || 0,
      width: Math.max(1, layer.width || 1),
      height: Math.max(1, layer.height || 1),
      fill,
      stroke,
      strokeWidth,
      rx: radius,
      ry: radius,
      opacity: (layer.opacity == null ? 1 : layer.opacity),
      angle: layer.rotation || 0,
      selectable: false,
      evented: false
    });
  }

  function makeText(layer){
    const st = layer.style || {};
    const text = (layer.data && layer.data.text) ? String(layer.data.text) : "";
    const fontFamily = st.fontFamily || "SourceHanSansSC";
    const fontSize = Number(st.fontSize || 24);
    const fontWeight = st.fontWeight ?? 400;
    const fontStyle = st.fontStyle || "normal";
    const underline = !!st.underline;

    const fill = normalizeColor(st.fill) || "#111111";
    const stroke = normalizeColor(st.stroke);
    const strokeWidth = Number(st.strokeWidth || 0);

    const lineHeight = Number(st.lineHeight || 1.16);
    const letterSpacing = Number(st.letterSpacing || 0);

    const align = (st.align || "left").toLowerCase();
    const textAlign = (["left","center","right","justify"].includes(align) ? align : "left");

    const obj = new fabric.Textbox(text, {
      left: layer.x || 0,
      top: layer.y || 0,
      width: Math.max(1, layer.width || 10),
      fontFamily,
      fontSize,
      fontWeight,
      fontStyle,
      underline,
      fill,
      stroke: strokeWidth > 0 ? (stroke || "#000000") : null,
      strokeWidth: strokeWidth > 0 ? strokeWidth : 0,
      lineHeight,
      // NOTE: Fabric charSpacing 单位是 1/1000 em；你后端的 letterSpacing 如果是 px，这里会有差异。
      // 当前先保持原样（多数你的 JSON 是 0）。
      charSpacing: letterSpacing,
      textAlign,
      opacity: (layer.opacity == null ? 1 : layer.opacity),
      angle: layer.rotation || 0,
      selectable: false,
      evented: false,
    });

    if (st.shadow && typeof st.shadow === "object") {
      const sh = st.shadow;
      obj.set("shadow", new fabric.Shadow({
        color: normalizeColor(sh.color) || "rgba(0,0,0,0.35)",
        blur: Number(sh.blur || 0),
        offsetX: Number(sh.offsetX || 0),
        offsetY: Number(sh.offsetY || 0)
      }));
    }
    return obj;
  }

  function loadHtmlImage(dataUrl){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("HTMLImage 加载失败"));
      img.src = dataUrl;
    });
  }

  async function setBackgroundFromDataURL(dataUrl){
    initCanvasOnce();
    bgDataUrl = dataUrl;
    bgHtmlImage = await loadHtmlImage(dataUrl);

    return new Promise((resolve, reject) => {
      fabric.Image.fromURL(dataUrl, (img) => {
        if (!img) return reject(new Error("背景图加载失败"));
        bgImageObj = img;
        applyBackgroundFit();
        resolve();
      }, { crossOrigin: "anonymous" });
    });
  }

  function applyBackgroundFit(){
    if (!canvas || !bgImageObj) return;
    const fit = $("bgFit").value;

    const iw = bgImageObj.width || 1;
    const ih = bgImageObj.height || 1;

    let scaleX = designW / iw;
    let scaleY = designH / ih;
    let left = 0;
    let top = 0;

    if (fit === "contain") {
      const s = Math.min(scaleX, scaleY);
      scaleX = scaleY = s;
      left = (designW - iw * s) / 2;
      top = (designH - ih * s) / 2;
    } else if (fit === "cover") {
      const s = Math.max(scaleX, scaleY);
      scaleX = scaleY = s;
      left = (designW - iw * s) / 2;
      top = (designH - ih * s) / 2;
    } else {
      left = 0; top = 0; // stretch
    }

    bgTransform = { left, top, scaleX, scaleY, iw, ih };

    canvas.setBackgroundImage(bgImageObj, canvas.requestRenderAll.bind(canvas), {
      originX: "left",
      originY: "top",
      left,
      top,
      scaleX,
      scaleY,
      opacity: 1
    });
    canvas.requestRenderAll();
  }

  // ====== Text color estimation (experimental) ======
  function rgbDist(a, b){
    const dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(dr*dr + dg*dg + db*db);
  }

  function meanColor(pixels){
    if (!pixels.length) return [0,0,0];
    let r=0,g=0,b=0;
    for (const p of pixels) { r+=p[0]; g+=p[1]; b+=p[2]; }
    const n = pixels.length;
    return [r/n, g/n, b/n];
  }

  // very small kmeans for k=2
  function kmeans2(points){
    if (points.length < 2) return null;
    // init: pick farthest pair approx
    let a = points[0];
    let b = points[Math.floor(points.length/2)];
    let best = -1;
    for (let i=0;i<50 && i<points.length;i++){
      const p = points[Math.floor(Math.random()*points.length)];
      const d = rgbDist(a,p);
      if (d > best) { best = d; b = p; }
    }
    let c1 = [...a], c2 = [...b];

    for (let iter=0; iter<10; iter++){
      const g1 = [], g2 = [];
      for (const p of points){
        if (rgbDist(p,c1) <= rgbDist(p,c2)) g1.push(p); else g2.push(p);
      }
      if (!g1.length || !g2.length) break;
      c1 = meanColor(g1);
      c2 = meanColor(g2);
    }

    // final assign for counts
    let n1=0, n2=0;
    for (const p of points){
      if (rgbDist(p,c1) <= rgbDist(p,c2)) n1++; else n2++;
    }
    return { c1, c2, n1, n2 };
  }

  function toHex(rgb){
    const r = clamp(Math.round(rgb[0]),0,255).toString(16).padStart(2,'0');
    const g = clamp(Math.round(rgb[1]),0,255).toString(16).padStart(2,'0');
    const b = clamp(Math.round(rgb[2]),0,255).toString(16).padStart(2,'0');
    return `#${r}${g}${b}`;
  }

  function samplePixelsInDesignBBox(designBBox){
    if (!bgHtmlImage) return null;

    const [dx1, dy1, dx2, dy2] = designBBox;
    const { left, top, scaleX, scaleY, iw, ih } = bgTransform;

    // map design coords -> image pixel coords
    const ix1 = (dx1 - left) / scaleX;
    const iy1 = (dy1 - top) / scaleY;
    const ix2 = (dx2 - left) / scaleX;
    const iy2 = (dy2 - top) / scaleY;

    const x1 = Math.floor(clamp(Math.min(ix1, ix2), 0, iw-1));
    const y1 = Math.floor(clamp(Math.min(iy1, iy2), 0, ih-1));
    const x2 = Math.floor(clamp(Math.max(ix1, ix2), 0, iw));
    const y2 = Math.floor(clamp(Math.max(iy1, iy2), 0, ih));

    const w = Math.max(1, x2-x1);
    const h = Math.max(1, y2-y1);

    const cvs = document.createElement("canvas");
    cvs.width = iw;
    cvs.height = ih;
    const ctx = cvs.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(bgHtmlImage, 0, 0);

    const imgData = ctx.getImageData(x1, y1, w, h).data;

    // stride: keep ~5000 samples max
    const total = w*h;
    const stride = Math.max(1, Math.floor(Math.sqrt(total / 5000)));

    const pixels = [];
    for (let yy=0; yy<h; yy+=stride){
      for (let xx=0; xx<w; xx+=stride){
        const idx = (yy*w + xx) * 4;
        const a = imgData[idx+3];
        if (a < 10) continue;
        pixels.push([imgData[idx], imgData[idx+1], imgData[idx+2]]);
      }
    }
    return { pixels, w, h };
  }

  function estimateTextFillForLayer(layer){
    const x1 = layer.x || 0;
    const y1 = layer.y || 0;
    const x2 = x1 + (layer.width || 0);
    const y2 = y1 + (layer.height || 0);

    const pack = samplePixelsInDesignBBox([x1,y1,x2,y2]);
    if (!pack || pack.pixels.length < 50) return null;

    const { pixels, w, h } = pack;

    // estimate background from border ring
    const ring = [];
    const ringT = Math.max(2, Math.floor(Math.min(w,h) * 0.12));
    for (let i=0;i<pixels.length;i++){
      // we don't know pixel coords here (sampled), so just take a portion as "border"
      // fallback: take first 20% samples as bg proxy (works if border dominates)
      if (i < Math.floor(pixels.length*0.2)) ring.push(pixels[i]);
    }
    const bg = meanColor(ring.length ? ring : pixels);

    // pick foreground candidates far from bg
    const scored = [];
    for (const p of pixels){
      scored.push([rgbDist(p,bg), p]);
    }
    scored.sort((a,b)=> b[0]-a[0]);
    const topN = scored.slice(0, Math.min(1500, scored.length)).map(x=>x[1]);

    const km = kmeans2(topN);
    if (!km) return toHex(meanColor(topN));

    // choose dominant cluster as fill
    const fill = (km.n1 >= km.n2) ? km.c1 : km.c2;
    return toHex(fill);
  }

  function recolorTextsFromBackground(){
    if (!lastJSON || !bgHtmlImage) {
      setStatus("重算文字颜色失败：需要先渲染 JSON 且加载背景图。", true);
      return;
    }

    const normalized = normalizeToLayers(lastJSON);
    const layers = normalized.layers.filter(l => l && l.type === "TEXT" && !l.hidden);

    let updated = 0;
    for (const l of layers){
      const c = estimateTextFillForLayer(l);
      if (!c) continue;
      l.style = l.style || {};
      l.style.fill = c;
      updated++;
    }

    lastJSON = normalized; // keep updated
    $("jsonInput").value = JSON.stringify(lastJSON, null, 2);
    renderFromJSON(lastJSON, { skipAutoRecolor: true });

    setStatus(`已重算文字颜色 ✅（更新 ${updated}/${layers.length} 个 TEXT）\n提示：这是“可视化校正”，真正精准还应在后端基于文字 mask/alpha 取色。`);
  }

  // ====== Render Pipeline ======
  function renderFromJSON(raw, opts={}){
    initCanvasOnce();
    clearOverlay();

    // keep backgroundImage if exists
    const keepBg = !!canvas.backgroundImage;

    canvas.getObjects().forEach(o => canvas.remove(o));

    if (!keepBg) canvas.setBackgroundImage(null, canvas.requestRenderAll.bind(canvas));

    const normalized = normalizeToLayers(raw);

    // design size correction (when backend returns processed size)
    let layers = normalized.layers;
    let targetW = normalized.width;
    let targetH = normalized.height;

    const useImgSize = $("useImgSizeAsDesign").checked;
    if (useImgSize && bgHtmlImage && (bgHtmlImage.width && bgHtmlImage.height)) {
      const iw = bgHtmlImage.width;
      const ih = bgHtmlImage.height;

      // if mismatch is obvious, scale layers to image size
      const dw = normalized.width, dh = normalized.height;
      const mismatch = (Math.abs(dw - iw) > 2) || (Math.abs(dh - ih) > 2);
      if (mismatch && dw > 0 && dh > 0) {
        const sx = iw / dw;
        const sy = ih / dh;
        layers = scaleLayers(layers, sx, sy);
        targetW = iw;
        targetH = ih;
      }
    }

    designW = targetW;
    designH = targetH;

    // sort by zIndex
    const sorted = [...layers].filter(l => l && !l.hidden).sort((a,b) => (a.zIndex||0) - (b.zIndex||0));

    let textCount = 0, shapeCount = 0, bgCount = 0;

    for (const layer of sorted) {
      if (!layer || !layer.type) continue;

      if (layer.type === "BG_IMAGE") { bgCount++; continue; }

      if (layer.type === "SHAPE") {
        canvas.add(makeShape(layer));
        shapeCount++;
        continue;
      }

      if (layer.type === "TEXT") {
        canvas.add(makeText(layer));
        textCount++;
        continue;
      }
    }

    // bbox overlays
    const showTextBox = $("showTextBox").checked;
    const showShapeBox = $("showShapeBox").checked;

    if (showTextBox) {
      sorted.filter(l => l.type === "TEXT").forEach(l => {
        addBBoxRect([l.x, l.y, (l.x||0)+(l.width||0), (l.y||0)+(l.height||0)], "#22c55e");
      });
    }
    if (showShapeBox) {
      sorted.filter(l => l.type === "SHAPE").forEach(l => {
        addBBoxRect([l.x, l.y, (l.x||0)+(l.width||0), (l.y||0)+(l.height||0)], "#f59e0b");
      });
    }

    applyBackgroundFit();
    resizeToContainer();
    applyViewport();
    canvas.requestRenderAll();

    setStatus(
      `渲染完成 ✅\n` +
      `design=${designW}×${designH}\n` +
      `layers=${sorted.length} (bg=${bgCount}, shape=${shapeCount}, text=${textCount})`
    );

    // auto recolor
    if (!opts.skipAutoRecolor && $("autoRecolor").checked && bgHtmlImage) {
      // only recolor when background fit is stretch, otherwise mapping may be cropped/letterboxed
      const fit = $("bgFit").value;
      if (fit === "stretch") {
        try {
          // update lastJSON with scaled normalized data, then recolor
          lastJSON = { width: designW, height: designH, layers: sorted };
          recolorTextsFromBackground();
        } catch (e) {
          console.warn(e);
        }
      }
    }
  }

  function clearAll(){
    initCanvasOnce();
    clearOverlay();
    canvas.getObjects().forEach(o => canvas.remove(o));
    canvas.setBackgroundImage(null, canvas.requestRenderAll.bind(canvas));
    bgImageObj = null;
    bgHtmlImage = null;
    bgDataUrl = null;
    lastJSON = null;
    setStatus("已清空。");
    resizeToContainer();
    applyViewport();
    canvas.requestRenderAll();
  }

  // ====== Backend call ======
  function readFileAsDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("读取文件失败"));
      reader.readAsDataURL(file);
    });
  }

  async function analyzeAndRender(file){
    initCanvasOnce();
    const base = $("backendUrl").value.trim().replace(/\/+$/,'');
    if (!base) return setStatus("后端地址为空", true);

    // 先加载同一张图为背景，保证坐标一致（你也可以后面再手动换背景）
    try {
      const dataUrl = await readFileAsDataURL(file);
      await setBackgroundFromDataURL(dataUrl);
      setStatus("背景已加载 ✅ 正在上传图片到后端解析…");
    } catch(e){
      setStatus("背景加载失败（仍继续后端解析）：\n" + (e?.message || String(e)), true);
    }

    const form = new FormData();
    form.append("file", file);

    const url = base + "/parse_fabric";
    const resp = await fetch(url, { method:"POST", body: form });
    if (!resp.ok) {
      const txt = await resp.text().catch(()=> "");
      throw new Error(`后端返回 ${resp.status}\n${txt}`);
    }
    const data = await resp.json();

    lastJSON = data;
    $("jsonInput").value = JSON.stringify(data, null, 2);
    renderFromJSON(data);
  }

  // ====== Wire UI ======
  $("btnRender").addEventListener("click", () => {
    try {
      const txt = $("jsonInput").value.trim();
      if (!txt) return setStatus("JSON 输入为空", true);
      const obj = JSON.parse(txt);
      lastJSON = obj;
      renderFromJSON(obj);
    } catch (e) {
      setStatus("JSON 解析失败：\n" + (e?.message || String(e)), true);
    }
  });

  $("btnClear").addEventListener("click", clearAll);

  $("btnExample").addEventListener("click", () => {
    const demo = {
      width: 896,
      height: 1200,
      layers: [
        { id:"bg-1", type:"BG_IMAGE", name:"背景", x:0,y:0,width:896,height:1200, opacity:1, rotation:0, locked:true, hidden:false, zIndex:0, data:{assetUrl:"string", fit:"cover"} },
        { id:"shape-1", type:"SHAPE", name:"色块", x:140, y:200, width:620, height:280, opacity:0.9, rotation:0, locked:false, hidden:false, zIndex:10,
          data:{shapeType:"rect"}, style:{fill:"rgba(20, 120, 255, 0.25)", stroke:"#000000", strokeWidth:0, radius:20} },
        { id:"text-1", type:"TEXT", name:"标题", x:180, y:240, width:540, height:90, opacity:1, rotation:0, locked:false, hidden:false, zIndex:100,
          data:{text:"示例标题", textAutoSize:"fixed"}, style:{fontFamily:"SourceHanSansSC", fontSize:72, fontWeight:700, fontStyle:"normal", underline:false, fill:"#111827", align:"center", stroke:"#000000", strokeWidth:0, shadow:null, lineHeight:1.1, letterSpacing:0} },
        { id:"text-2", type:"TEXT", name:"副标题", x:220, y:340, width:460, height:50, opacity:1, rotation:0, locked:false, hidden:false, zIndex:101,
          data:{text:"副标题示例", textAutoSize:"fixed"}, style:{fontFamily:"SourceHanSansSC", fontSize:40, fontWeight:400, fontStyle:"normal", underline:false, fill:"rgb(55, 65, 81)", align:"center", stroke:"#000000", strokeWidth:0, shadow:null, lineHeight:1.2, letterSpacing:0} }
      ]
    };
    $("jsonInput").value = JSON.stringify(demo, null, 2);
    lastJSON = demo;
    renderFromJSON(demo);
  });

  $("btnAnalyze").addEventListener("click", async () => {
    const f = $("imgFile").files && $("imgFile").files[0];
    if (!f) return setStatus("请先选择图片文件", true);
    try {
      await analyzeAndRender(f);
    } catch (err) {
      setStatus("解析失败：\n" + (err?.message || String(err)), true);
      console.error(err);
    }
  });

  $("imgFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      await analyzeAndRender(f);
    } catch (err) {
      setStatus("解析失败：\n" + (err?.message || String(err)), true);
      console.error(err);
    }
  });

  $("bgFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const dataUrl = await readFileAsDataURL(f);
      await setBackgroundFromDataURL(dataUrl);
      applyViewport();
      setStatus("背景已加载 ✅（注意：若要严格对齐坐标，请选 stretch）");
      // 如果已经渲染过 JSON，重渲染一次让 fit 生效
      if (lastJSON) renderFromJSON(lastJSON, { skipAutoRecolor: true });
    } catch (err) {
      setStatus("背景加载失败：\n" + (err?.message || String(err)), true);
    }
  });

  $("bgFit").addEventListener("change", () => {
    applyBackgroundFit();
    canvas.requestRenderAll();
  });

  $("autoFit").addEventListener("change", () => {
    applyViewport();
    canvas.requestRenderAll();
  });

  $("showTextBox").addEventListener("change", () => {
    if (!lastJSON) return;
    try { renderFromJSON(lastJSON, { skipAutoRecolor: true }); } catch(e){}
  });

  $("showShapeBox").addEventListener("change", () => {
    if (!lastJSON) return;
    try { renderFromJSON(lastJSON, { skipAutoRecolor: true }); } catch(e){}
  });

  $("btnRecolor").addEventListener("click", () => {
    recolorTextsFromBackground();
  });

  $("useImgSizeAsDesign").addEventListener("change", () => {
    if (!lastJSON) return;
    try { renderFromJSON(lastJSON, { skipAutoRecolor: true }); } catch(e){}
  });

  $("autoRecolor").addEventListener("change", () => {
    // no-op
  });

  // Init
  initCanvasOnce();
  setStatus("状态：就绪。可直接粘贴 JSON 渲染，或选择图片走后端解析。");
})();
</script>
</body>
